name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows like the launcher: the tests use Windows paths (C:\client) and named mutexes.
    # No game files here: tests build synthetic packages; the self-update E2E (scripts/Test-SelfUpdate.ps1)
    # needs a copy of the original Icon.utx and stays a manual check.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore L2Mod.slnx

      - name: Build (warnings are errors)
        run: dotnet build L2Mod.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test L2Mod.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # The same flags as src/CpLauncher/README.md; trim/AOT warnings fail the build.
      - name: Publish the launcher (single file, trimmed)
        run: >-
          dotnet publish src/CpLauncher -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=true
          -warnaserror -o publish

      - name: Upload the launcher
        uses: actions/upload-artifact@v7
        with:
          name: CpLauncher-${{ github.sha }}
          path: publish/CpLauncher.exe
          if-no-files-found: error
          retention-days: 7
